name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages. This is the seed of the CI/CD
# pipeline — add lint/test/staging steps here over time. No Docker needed: Pages
# serves the static Vite build directly.

on:
  push:
    branches: [experimental, main]
  workflow_dispatch:

# Least-privilege permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (demo mode with mock data)
        run: npm run build
        env:
          # Enable the MSW mock API so the deployed PoC shows data (no backend yet).
          VITE_ENABLE_MOCKS: 'true'

      - name: SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # Auto-create/enable the Pages site so no manual setup is required.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
